Me:
  get:
    tags:
      - Account
    operationId: getCurrentUser
    summary: Get the current user
    description: Returns the MESBG List Builder account for the authenticated user.
    security:
      - bearerAuth: []

    responses:
      "200":
        description: Current authenticated user.
        content:
          application/json:
            schema:
              $ref: "../schemas/account.yaml#/CurrentUser"

      "401":
        description: Authentication is required.