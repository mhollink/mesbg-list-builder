name: mesbg

services:
  database:
    image: mariadb:11.8
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - database-data:/var/lib/mysql
      - ./infra/docker/mariadb/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/mhollink/mesbg-list-builder-backend:latest
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/mesbg
      SPRING_DATASOURCE_USERNAME: mesbg
      SPRING_DATASOURCE_PASSWORD: mesbg

    mem_limit: 1g

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped

    command:
      - start-dev
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "8081:8080"

    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://database:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    mem_limit: 1g

    volumes:
      - ./infra/docker/keycloak/themes:/opt/keycloak/themes:ro
      - ./infra/docker/keycloak/export:/opt/keycloak/data/export
volumes:
  database-data: