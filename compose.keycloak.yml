name: mesbg-keycloak
include:
  - compose.database.yml
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://database:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    mem_limit: 1g
    volumes:
      - ./infra/docker/keycloak/themes:/opt/keycloak/themes:ro
      - ./infra/docker/keycloak/export:/opt/keycloak/data/import:ro