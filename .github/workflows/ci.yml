name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend & data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API client
        run: pnpm --filter @mlb/api-client build

      - name: Check frontend formatting
        run: pnpm --filter @mlb/frontend exec biome check .

      - name: Check data formatting
        run: pnpm --filter @mlb/data exec biome check .

      - name: Run frontend unit tests
        run: pnpm --filter @mlb/frontend test

      - name: Build data
        run: pnpm --filter @mlb/data build

      - name: Build frontend
        run: pnpm --filter @mlb/frontend build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Check formatting
        run: ./mvnw --batch-mode spotless:check

      - name: Build and test
        run: ./mvnw --batch-mode verify