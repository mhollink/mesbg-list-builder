name: Publish backend image

on:
  push:
    branches:
      - master
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mhollink/mesbg-list-builder-backend

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and publish image
        run: |
          ./mvnw --batch-mode verify jib:build \
            -Dimage="${IMAGE}:latest" \
            -Djib.to.tags="sha-${GITHUB_SHA}"

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" \
            > ~/.ssh/id_ed25519
          
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts
          
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            cd /opt/mesbg
          
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
          EOF