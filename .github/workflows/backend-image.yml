name: Publish backend image

on:
  push:
    branches:
      - master
    paths:
      - "apps/backend/**"
      - "api/**"
      - "infra/docker/keycloak/**"
      - ".github/workflows/backend-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mhollink/mesbg-list-builder-backend

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and publish image
        run: |
          ./mvnw --batch-mode verify jib:build \
            -Dimage="${IMAGE}:latest" \
            -Djib.to.tags="sha-${GITHUB_SHA}"

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" \
            > ~/.ssh/id_ed25519
          
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts
          
          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare Keycloak directories
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            mkdir -p /opt/mesbg/keycloak/import
            mkdir -p /opt/mesbg/keycloak/themes
          EOF

      - name: Sync Keycloak configuration
        id: keycloak
        run: |
          IMPORT_CHANGES="$(
            rsync \
              -rlz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/import/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/import/"
          )"

          THEME_CHANGES="$(
            rsync \
              -rlz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/themes/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/themes/"
          )"

          printf '%s\n' "$IMPORT_CHANGES"
          printf '%s\n' "$THEME_CHANGES"

          if [[ -n "$IMPORT_CHANGES" || -n "$THEME_CHANGES" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          KEYCLOAK_CHANGED: ${{ steps.keycloak.outputs.changed }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "KEYCLOAK_CHANGED='${KEYCLOAK_CHANGED}' bash -s" <<'EOF'
            set -euo pipefail

            cd /opt/mesbg
          
            docker compose pull backend keycloak
            docker compose up -d backend

            if [[ "$KEYCLOAK_CHANGED" == "true" ]]; then
              echo "Keycloak configuration changed, recreating container..."
              docker compose up -d --force-recreate keycloak
            else
              docker compose up -d keycloak
            fi

            docker image prune -f
          EOF