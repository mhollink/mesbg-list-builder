name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/mhollink/mesbg-list-builder-backend

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag and master ancestry
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3."
            exit 1
          fi

          if [[ "$(git log -1 --format=%s)" != "chore(release): ${GITHUB_REF_NAME}" ]]; then
            echo "Tag must point to its matching release commit."
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "The release commit must already be on master."
            exit 1
          fi

  build:
    name: Build and test release
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ github.sha }}
          path: artifacts/frontend

      - name: Download backend image artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-image-${{ github.sha }}
          path: artifacts/backend

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker load --input artifacts/backend/jib-image.tar

          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

          docker tag \
            "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            "${BACKEND_IMAGE}:latest"

          docker push "${BACKEND_IMAGE}:latest"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare Keycloak directories
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            mkdir -p /opt/mesbg/keycloak/import
            mkdir -p /opt/mesbg/keycloak/themes
          EOF

      - name: Sync Keycloak configuration
        id: keycloak
        run: |
          IMPORT_CHANGES="$(
            rsync \
              -rlcz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/import/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/import/"
          )"

          THEME_CHANGES="$(
            rsync \
              -rlcz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/themes/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/themes/"
          )"

          if [[ -n "$IMPORT_CHANGES" || -n "$THEME_CHANGES" ]]; then
            printf '%s\n' "$IMPORT_CHANGES" "$THEME_CHANGES"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Keycloak configuration changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
            set -euo pipefail

            cd /opt/mesbg

            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f
          EOF

      - name: Apply Keycloak configuration changes
        if: steps.keycloak.outputs.changed == 'true'
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
            set -euo pipefail

            cd /opt/mesbg

            echo "Keycloak configuration changed, recreating container..."
            docker compose pull keycloak
            docker compose up -d --no-deps --force-recreate keycloak
          EOF

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: artifacts/frontend/
          server-dir: /public_html/test/
          log-level: minimal