name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/mhollink/mesbg-list-builder-backend

jobs:
  deploy:
    name: Deploy
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ github.event.workflow_run.head_sha }}
          path: artifacts/frontend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend image artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-image-${{ github.event.workflow_run.head_sha }}
          path: artifacts/backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker load --input artifacts/backend/jib-image.tar

          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"

          docker tag \
            "${BACKEND_IMAGE}:${IMAGE_TAG}" \
            "${BACKEND_IMAGE}:latest"

          docker push "${BACKEND_IMAGE}:latest"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare Keycloak directories
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            mkdir -p /opt/mesbg/keycloak/import
            mkdir -p /opt/mesbg/keycloak/themes
          EOF

      - name: Sync Keycloak configuration
        id: keycloak
        run: |
          IMPORT_CHANGES="$(
            rsync \
              -rlz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/import/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/import/"
          )"

          THEME_CHANGES="$(
            rsync \
              -rlz \
              --delete \
              --omit-dir-times \
              --itemize-changes \
              -e "ssh -i ~/.ssh/id_ed25519" \
              infra/docker/keycloak/themes/ \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mesbg/keycloak/themes/"
          )"

          printf '%s\n' "$IMPORT_CHANGES"
          printf '%s\n' "$THEME_CHANGES"

          if [[ -n "$IMPORT_CHANGES" || -n "$THEME_CHANGES" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend
        env:
          KEYCLOAK_CHANGED: ${{ steps.keycloak.outputs.changed }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "KEYCLOAK_CHANGED='${KEYCLOAK_CHANGED}' bash -s" <<'EOF'
            set -euo pipefail

            cd /opt/mesbg

            docker compose pull backend keycloak
            docker compose up -d backend

            if [[ "$KEYCLOAK_CHANGED" == "true" ]]; then
              echo "Keycloak configuration changed, recreating container..."
              docker compose up -d --force-recreate keycloak
            else
              docker compose up -d keycloak
            fi

            docker image prune -f
          EOF

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: artifacts/frontend/
          server-dir: /public_html/test/
          log-level: minimal