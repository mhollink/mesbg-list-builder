name: mesbg-backend
include:
  - compose.database.yml
  - compose.keycloak.yml
services:
  backend:
    image: ghcr.io/mhollink/mesbg-list-builder-backend:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/mesbg
      SPRING_DATASOURCE_USERNAME: mesbg
      SPRING_DATASOURCE_PASSWORD: mesbg
    mem_limit: 640m